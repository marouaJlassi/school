services:
  mysql:
    image: mysql:8.4
    container_name: mysqldevops
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db-school
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    image: ${DOCKER_USER}/school-backend:latest   # ou school-backend:latest si local
    container_name: schooldevops
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db-school?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8089:8089"

volumes:
  mysqldata: