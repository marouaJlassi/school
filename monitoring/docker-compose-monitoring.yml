services:
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqlexporterdevops
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    volumes:
      - ./monitoring/mysqld-exporter/.my.cnf:/cfg/.my.cnf:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheusdevops
    restart: unless-stopped
    depends_on:
      - mysqld-exporter
      - backend
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    container_name: grafanadevops
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prometheusdata:
  grafanadata: