# Usage (always together with the main file, from the project root):
#   docker compose -f docker-compose.yml -f monitoring/docker-compose-monitoring.yml up -d
# Relative paths below are resolved from the folder of the FIRST -f file (project root).
services:
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    volumes:
      - ./monitoring/mysqld-exporter/.my.cnf:/cfg/.my.cnf:ro

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      - mysqld-exporter
      - backend
    ports:
      - "9092:9090"        # host 9092 -> container 9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    healthcheck:
      # healthchecks run INSIDE the container -> use the container port (9090)
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"        # host 3001 -> container 3000
    volumes:
      - grafanadata:/var/lib/grafana
      # Grafana only auto-loads datasources from provisioning/datasources/
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  prometheusdata:
  grafanadata: